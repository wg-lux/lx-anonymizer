implemented_safeguard:
  analysis_budget_seconds_default: 3600
  configurable_through: FrameCleanerSamplingProfile.max_analysis_seconds
  projection_warmup_frames: 32
  projection_warmup_seconds: 30
  observed_failure_projection_detection_seconds_approximately: 94.7
  interval_probe_limit: 128
  partial_metadata:
    - Preserve collected names and other metadata without inventing missing values.
    - Validate and expose exact inspected frame numbers, coverage completeness, mode, cap reason and elapsed budget.
    - Preserve sequential decoding while reducing expensive OCR to bounded interval-subdivision positions after projected exhaustion.
  candidate_behavior:
    - mask_overlay still processes every source frame and can return the unpublished candidate with partial metadata, as explicitly requested by the user.
    - Publication remains owned by endoreg-db; human anonymization acceptance remains a separate gate.
    - extract_only returns the immutable source and useful partial metadata.
    - remove_frames still fails on a cap, because incomplete sensitivity detection cannot safely decide which frames to remove.
    - Decoder and actual OCR failures remain errors; only the explicit budget cap is handled gracefully.
  limitations:
    - Interval subdivision is a broad timeline sampling schedule, not a monotonic binary search. It can miss isolated overlays outside inspected frames.
    - Checks surround synchronous OCR and decoder calls; a native call that never returns still requires caller process-level cancellation.
    - The one-hour budget covers frame analysis, not metadata enrichment, encoding or HLS, whose own budgets remain caller-owned.
    - The safeguard is a local source change; the deployed wheel runtime has not been changed.
