  - id: real_media_pipeline
    category: functionality
    title: Real media crosses the complete local anonymization pipeline
    acceptance:
      - A real source is decoded, analyzed through FrameCleaner, masked by FFmpeg, and probed again.
      - The candidate preserves dimensions and frame count, removes audio, and visibly blacks pixels outside the ROI.
      - The immutable source digest is unchanged and the returned metadata validates against VideoMeta.
