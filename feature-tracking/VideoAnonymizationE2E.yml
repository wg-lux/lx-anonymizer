definition_of_done:
  - id: public_video_boundary
    category: data_integrity
    title: Public video invocations fail closed at ownership boundaries
    acceptance:
      - Missing, empty, non-regular, and symbolic-link sources are rejected before processing.
      - Pre-existing, suffixless, or source-equal output paths are rejected before processing.
      - Non-positive rational source frame rates are rejected before processing.
      - Failed processing removes only the invocation-owned partial candidate and preserves the source.
      - Frame-removal and masking failures raise instead of returning apparent success.
    required: true
    verification:
      kind: command
      command:
        - .devenv/state/venv/bin/python
        - -m
        - pytest
        - tests/test_video_anonymization_e2e.py
        - -q
      timeout_seconds: 300
    assessment:
