- id: robust_mixed_payload_resolution
  category: functionality
  title: Mixed sensitive metadata resolves without partial or untyped state
  acceptance:
  - Unknown upstream fields are projected out at the named compatibility boundary.
  - Blank and null-equivalent values cannot downgrade populated metadata.
  - Reversed dates may be repaired within one observation; combining observations must never overwrite
    an established birth or examination date.
  - Invalid recognized fields raise a redacted SensitiveMetaResolutionError, preserve every field and
    typed state, and are not converted to empty successful results by video, report, or asynchronous LLM
    wrappers.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - -m
    - pytest
    - tests/test_sensitive_meta_interface.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: lx_anonymizer/sensitive_meta_interface.py
    - kind: test
      reference: tests/test_sensitive_meta_interface.py
    - kind: command
      reference: .devenv/state/venv/bin/pyright (0 errors)
    - kind: command
      reference: focused metadata and consumer tests (84 passed)
    - kind: command
      reference: full pytest suite (299 passed, 3 skipped)
    assessed_by: codex-sensitive-meta-20260921
    assessed_at: '2026-09-21T12:49:05.092753+00:00'
    note: Invalid recognized fields now raise a redacted SensitiveMetaResolutionError without partial
      mutation. Video, report, LLM and asynchronous worker wrappers propagate this error instead of treating
      it as absent metadata. Unknown diagnostic keys and blank observations remain supported. Existing
      same-observation date-role repair is preserved; merges validate with the shared lx_dtypes model
      and cannot swap an established DOB with a later examination observation. Earlier passing evidence
      above is historical; the 2026-09-21 runs verify the current behavior.
- id: request_isolated_llm_metadata
  category: data_integrity
  title: LLM metadata is isolated across requests and cache consumers
  acceptance:
  - Every full and smart-sampling extraction starts with a fresh metadata accumulator; returning no result
    must not retain a previous patient.
  - Cache writes and reads use independent deep copies, including nested verification state.
  - Cache keys use full SHA256 of request text; this is an ephemeral cache key, not a patient identity
    hash.
  - Canonical and legacy clinical aliases reach video signal detection only after shared normalization.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/test_llm_meta_helpers.py
    - tests/test_frame_report_helper_logic.py
    - -q
    - -o
    - log_cli=false
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: lx_anonymizer/llm/llm_extractor.py
    - kind: test
      reference: tests/test_llm_meta_helpers.py
    assessed_by: codex-sensitive-meta-20260921
    assessed_at: '2026-09-21T12:49:05.092753+00:00'
    note: Each extraction resets its request state, including no-model/no-signal returns. Cached inputs
      and outputs are deep copies, including nested verification state. Full SHA256 replaces truncated
      MD5 only for ephemeral text cache keys. Canonical and legacy clinical aliases are normalized before
      video signal detection. Patient/examination hashing and salt ownership remain exclusively in endoreg-db.
      Stateful extractors remain invocation-owned and are not declared safe for concurrent sharing. Local
      component checks do not establish clinical OCR recall, production runtime acceptance, or approval
      to deploy. Source /home/admin/lx-anonymizer at 16b274b273243b669d26299a94efea20eb79bd5c with pre-existing
      unrelated dirty changes; lx-anonymizer 0.9.8 and lx-dtypes 0.3.5. No feature lock acquired per user
      instruction; this repository has no tracker.py. Required uv sync initially inherited the lx-annotate
      environment path; that environment was restored with its own lockfile. Subsequent sync explicitly
      targeted the lx-anonymizer environment and the existing CPython 3.12.14 interpreter. lx-annotate
      decord 0.6.0 imports successfully, but its wheel internal cp36 platform tag causes uv audit to request
      reinstall repeatedly; no wheel metadata was falsified. No production service, salt, identity record,
      or release artifact was changed.
