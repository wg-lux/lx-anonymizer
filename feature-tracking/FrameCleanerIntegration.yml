schema_version: "1.0"
id: frame_cleaner_integration
name: FrameCleaner application integration
description: >-
  Maintain the public FrameCleaner boundary as the typed, fail-closed
  lx-anonymizer implementation used by attempt-scoped video import workflows.
owners:
  - lx-anonymizer maintainers
production_critical: true
source_documents:
  - path: docs/VIDEO_IMPORT_CONCURRENCY_CONTRACT.md
    disposition: normative
    note: Defines the local component boundary and links to the canonical endoreg-db contract.
invariants:
  - A FrameCleaner instance is mutable per-video state and is never shared by concurrent attempts.
  - Input media is immutable and output is one unpublished attempt-owned candidate.
  - Integrity, FFmpeg, FFprobe, masking, and cancellation failures raise loudly and clean only invocation-owned temporary artifacts.
definition_of_done:
  - id: bounded_metadata_return
    category: operations
    title: Infeasible exhaustive OCR returns useful bounded metadata without weakening overlay masking
    acceptance:
      - Exhaustive analysis has a finite positive caller-configurable time budget, defaulting to 3600 seconds; warmup requires at least 32 inspected frames and 30 elapsed seconds before throughput projection.
      - On infeasible projected completion, mask_overlay and extract_only use at most 128 interval-subdivision probe positions in addition to the inspected prefix, preserving immutable source order and useful collected metadata.
      - On elapsed budget exhaustion, those modes return partial metadata with validated inspected frame numbers, completeness, mode, cap reason and elapsed budget; no missing value is invented.
      - Whole-video overlay masking still covers every output frame and preserves the candidate contract; human anonymization validation remains a separate application gate. Partial analysis cannot drive remove_frames.
      - Decoder failures, actual OCR failures and invalid metadata coverage still propagate; the analysis budget is checked around synchronous calls and does not claim to preempt a hung native call.
    required: true
    verification:
      kind: command
      command: [.venv/bin/pytest, tests/test_frame_analysis_budget.py, tests/test_exhaustive_video_metadata.py, tests/test_video_anonymization_e2e.py, tests/test_processing_strands.py, -q]
      timeout_seconds: 600
    assessment:
      status: in_progress
      assessed_by: codex-dataset-audit-20261002
      assessed_at: '2026-10-02'
      evidence:
        - kind: command
          reference: 78 focused tests passed in 16.59 seconds; full repository Pyright reports 0 errors; no added lint findings.
        - kind: document
          reference: feature-tracking/reports/gc-02-ocr-runtime-diagnostics.yml
      note: Local source implementation is verified, including real full-video masking after partial metadata return. Deployed runtime remains unchanged; representative host acceptance and ONNX package conflict repair remain outstanding.
  - id: redacted_ocr_progress
    category: operations
    title: Long exhaustive OCR runs expose bounded aggregate telemetry
    acceptance:
      - First inference, periodic progress and inference failures report completed inference counts and elapsed times without OCR text or exception values.
      - Stage timing availability and configured session providers are explicit; missing backend telemetry is not fabricated.
      - Telemetry preserves exhaustive frame coverage and does not introduce parallel inference or retries.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/test_ocr_frame_rapidocr.py, tests/test_exhaustive_video_metadata.py, -q]
      timeout_seconds: 600
    assessment:
      status: in_progress
      assessed_by: codex-gc02-import-20260928
      assessed_at: '2026-09-28T07:36:08.361070+00:00'
  - id: exhaustive_metadata_analysis
    category: functionality
    title: Every source frame contributes to patient metadata extraction
    acceptance:
      - Within its analysis budget, the exhaustive profile uses full-frame RapidOCR without sample caps, ROI exclusions, vision LLM calls, or metadata-driven early stopping. Explicit budget caps are governed by bounded_metadata_return.
      - Sequential decoding preserves frame order and closes the decoder on success, cancellation, or failure; incomplete decoding raises.
      - Only pixel-identical consecutive frames reuse OCR; changed pixels always trigger inference.
      - Repeated text extraction and retained LLM candidates are bounded per invocation; observation capacity exhaustion raises.
      - The exhaustive profile explicitly bounds ONNX Runtime intra-operator and inter-operator thread pools.
      - Auxiliary PHI-region proposal inference retains its independent sample budget and never gates exhaustive OCR.
      - Tests place a single patient overlay at the first, middle, and last frame and beyond the normal sample budget.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_exhaustive_video_metadata.py, tests/test_ocr_frame_rapidocr.py, -q]
      timeout_seconds: 600
    assessment:
      status: verified
      evidence:
        - kind: test
          reference: tests/test_exhaustive_video_metadata.py
          note: Lossless source decoding with controlled OCR verifies single-frame overlays, exact pixel caching, bounded text retention, and decoder cleanup.
        - kind: command
          reference: Full lx-anonymizer Pyright (0 errors, 8 existing warnings); focused exhaustive/OCR/frame/concurrency/real-media/strand/helper/metrics suite (97 passed).
        - kind: command
          reference: New exhaustive test file passes Ruff; changed production files have no added Ruff findings against HEAD (103 existing findings).
        - kind: command
          reference: Endoreg import adapter, import normalization, storage normalization, and import service suite (106 passed, 2 warnings, 528.37 seconds); full endoreg Pyright (0 errors, 1 existing warning).
          note: Includes real 501-frame 1080p import with RapidOCR. Endoreg uses the local editable lx-anonymizer package; caller and compute package must be deployed together. This is functional verification, not a controlled throughput or clinical recall benchmark.
      assessed_by: codex-metadata-boundaries-20260910
      assessed_at: "2026-09-10"
  - id: typed_public_boundary
    category: requirements
    title: FrameCleaner exposes a typed invocation and result boundary
    acceptance:
      - Public inputs are normalized once and invalid paths, frame rates, and ownership combinations are rejected before processing.
      - Video metadata and sampled-frame observations validate against lx-dtypes models.
      - Input-dependent return values are explicit and do not use unstructured dictionaries as the internal contract.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pyright]
      timeout_seconds: 600
  - id: real_media_pipeline
    category: functionality
    title: Real video crosses decode, analysis, masking, and verification
    acceptance:
      - A real source is decoded, sampled through FrameCleaner, masked by FFmpeg, and probed again.
      - The candidate preserves required video properties and visibly masks pixels outside the selected ROI.
      - The source digest remains unchanged throughout successful and failing invocations.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_video_anonymization_e2e.py, -q]
      timeout_seconds: 600
  - id: attempt_isolation
    category: data_integrity
    title: Concurrent attempts remain isolated and fail closed
    acceptance:
      - Concurrent use of one FrameCleaner instance is rejected.
      - Every subprocess, temporary directory, named pipe, and output path has one invocation owner and bounded cancellation.
      - Failed processing removes only the invocation-owned partial candidate and cannot report apparent success.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_frame_cleaner_concurrency.py, tests/test_video_anonymization_e2e.py, -q]
      timeout_seconds: 600
