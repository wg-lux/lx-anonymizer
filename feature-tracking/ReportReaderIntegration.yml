  - id: typed_public_boundary
    category: requirements
    title: ReportReader exposes versioned typed request and result contracts
    acceptance:
      - External flags and request payloads are normalized once into strict lx-dtypes models.
      - Results identify the report anonymization contract version and validate metadata and artifact state before return.
      - Unsupported contract versions and invalid known fields fail validation rather than being silently retained.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_report_reader_contract.py, -q]
      timeout_seconds: 600
  - id: report_pipeline
    category: functionality
    title: Representative reports cross extraction and anonymization boundaries
    acceptance:
      - Supported PDF and image inputs exercise decoding, OCR or text extraction, metadata resolution, and anonymized artifact creation.
      - Returned metadata propagates through the public result without unvalidated intermediate dictionaries.
      - Source artifacts remain unchanged during successful and failing invocations.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_report_reader_example_report.py, tests/test_report_reader_contract.py, -q]
      timeout_seconds: 600
  - id: capability_and_failure_policy
    category: data_integrity
    title: Optional model capabilities and failures remain explicit
    acceptance:
      - LLM enablement requires a configured and available provider and is observable in initialization behavior.
      - Named deterministic OCR, NER, or regex behavior remains available only where the documented capability profile permits it.
      - Processing failures clean only invocation-owned temporary artifacts and cannot return an apparently complete result.
      - PDF-Schwärzung prüft deu+eng-Sprachdaten vor dem Rendern mit dem vorhandenen Tesseract-Resolver.
      - Nix-Installationen beziehen Tessdata auch bei direkten Python-Importen aus dem in package.nix definierten Tesseract-Paket; fehlende Paketsprachdaten werden nicht durch Systemdaten ersetzt.
      - Missing OCR runtime data and PDF processing failures raise a classified AnonymizationArtifactError instead of returning None; public errors suppress external exception payloads and chains, and import sources remain unchanged.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, -m, pytest, tests/test_report_reader_init.py, tests/test_report_reader_ollama_ocr.py, -q]
      timeout_seconds: 600
    assessment:
      status: in_progress
      assessed_by: codex-pdf-import-20260923
      evidence:
        - kind: command
          reference: nix run .#nixtest
          note: >-
            Nix-Paket erfolgreich gebaut; packaged-tessdata-python-import besteht mit echten
            deu/eng-Sprachdaten trotz ungültigem Host-Prefix. Zwei vorhandene CLI-Tests scheitern:
            package-smoke erwartet einen veralteten Hilfetext; base-cli-missing-ocr-deps erwartet
            einen anderen Fehlertext, tatsächlich fehlt lx_dtypes im Basispaket. Keine Produktionsaktivierung.
        - kind: command
          reference: .devenv/state/venv/bin/pytest tests/test_tessdata.py tests/test_anonymizer.py tests/test_report_reader_contract.py -q --tb=short -o log_cli=false
          note: 2026-09-23 Nix-Tessdata-Ergänzung; 47 Tests bestanden. Paketdatenpriorität, unveränderte Umgebung sowie Abbruch bei unvollständigen Daten oder defektem Paketlink geprüft.
        - kind: command
          reference: nix eval --raw .#packages.x86_64-linux.lx-anonymizer.installPhase
          note: Paketlink, Sprachdateiprüfung und CLI-PATH verweisen auf dieselbe Tesseract-Derivation mit deu und eng. Nix-Syntaxprüfung, Pyright (0 Fehler, 8 bestehende Warnungen), Ruff und Formatprüfung bestanden.
        - kind: command
          reference: uv sync --extra dev
          note: Abhängigkeiten vor Pyright und pytest synchronisiert.
        - kind: command
          reference: .devenv/state/venv/bin/pyright
          note: 0 Fehler, 8 bestehende Warnungen außerhalb der Änderung. Geänderte Dateien ohne Fehler oder Warnungen.
        - kind: command
          reference: .devenv/state/venv/bin/pytest tests/test_tessdata.py tests/test_anonymizer.py tests/test_report_reader_contract.py tests/test_report_reader_init.py tests/test_report_reader_ollama_ocr.py -q --tb=short
          note: 51 Tests bestanden in 23.74 Sekunden; Fehlerursachen, unveränderte Quellen und versuchseigenes Cleanup geprüft.
      note: >-
        package.nix verlinkt die ausgewählten Nix-Sprachdaten in resources/tessdata; der gemeinsame
