schema_version: "1.0"
id: report_reader_integration
name: ReportReader application integration
description: >-
  Maintain ReportReader as the typed, fail-closed lx-anonymizer boundary for
  extracting metadata and producing anonymized report artifacts from immutable
  attempt-owned inputs.
owners:
  - lx-anonymizer maintainers
production_critical: true
source_documents:
  - path: docs/report_pipeline_concurrency_contract.md
    disposition: normative
    note: Defines local processing ownership and the endoreg-db integration boundary.
  - path: docs/MODEL_CALLS_AND_DECISIONS.md
    disposition: reference
    note: Documents OCR, NER, and LLM decision points and capability behavior.
invariants:
  - ReportReader processes immutable caller-owned input and returns typed metadata plus an unpublished attempt-owned result.
  - Durable attempts, leases, fencing, retries, publication, and clinical identity persistence remain outside lx-anonymizer.
  - Invalid input, contract mismatch, extraction failure, and artifact-integrity failure raise loudly without exposing partial output as success.
  - Employee name lists are optional caller-provided inputs; report-reader settings contain no hardcoded name lists or default name source.
definition_of_done:
  - id: content_free_anonymizer_logs
    category: security
    title: Anonymizer diagnostics never disclose document content
    acceptance:
      - Remove OCR excerpts, matched sensitive values, metadata payloads, prompts, provider responses and identifying filenames from report-processing logs at every level, including debug and exception paths.
      - Emit only allowlisted event codes, phases, counts, durations and opaque attempt identifiers; preserve useful failure classification without interpolating input or exception payloads.
      - Cover the sensitive-region cropper and the invoked OCR, NER, LLM and PDF adapters, including stdout/stderr captured and relabelled by Celery; log-level suppression or verbose=false alone is not sufficient.
      - Regression tests use deterministic non-patient sentinel content and assert its absence from logs and captured output on success, provider failure and redaction failure while safe diagnostics remain observable.
      - This compute boundary does not introduce durable attempt state, retries or publication authority; endoreg-db retains those responsibilities.
    required: true
    verification:
      kind: manual
      instructions: Review report call-chain logging, run strict Pyright and focused logging regressions, then verify sanitized packaged-worker output without recording source content.
      timeout_seconds: 900
    assessment:
      status: verified
      assessed_by: codex-anonymizer-logs-20261016
      evidence:
